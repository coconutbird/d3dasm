[package]
name = "d3dasm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CLI tool for disassembling Direct3D shader bytecode"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["dxbc", "directx", "shader", "disassembler", "hlsl"]
categories = ["command-line-utilities", "game-development"]
readme.workspace = true

[lints]
workspace = true

[[bin]]
name = "d3dasm"
path = "src/main.rs"
doc = false

[dependencies]
clap.workspace = true
d3dasm = { workspace = true, features = ["std"] }
d3dasm-decompiler.workspace = true
dxbc = { workspace = true, features = ["std"] }
