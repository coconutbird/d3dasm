[workspace]
resolver = "3"
members = [
    "crates/dxbc",
    "crates/d3dasm",
    "crates/d3dasm-cli",
    "crates/dxbc/fuzz",
]
default-members = ["crates/dxbc", "crates/d3dasm", "crates/d3dasm-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/coconutbird/d3dasm"
homepage = "https://github.com/coconutbird/d3dasm"
authors = ["Jon-Luke Biddle"]
readme = "README.md"

[workspace.dependencies]
arbitrary = "1"
clap = { version = "4.5.60", features = ["derive"] }
d3dasm = { version = "0.1.0", path = "crates/d3dasm" }
dxbc = { version = "0.1.0", path = "crates/dxbc" }
libfuzzer-sys = "0.4"
memchr = { version = "2.8.0", default-features = false }
nostdio = "0.2.0"
smallvec = { version = "1.15.1", default-features = false, features = ["union"] }

# Keep memchr optimized even in debug builds so scanning is still efficient.
[profile.dev.package.memchr]
opt-level = 2

[workspace.lints.rust]
warnings = { level = "deny", priority = -2 }
unused = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }
